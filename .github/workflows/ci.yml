name: CI

on:
  push:
  pull_request:

jobs:
  check-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BRAND_NAME: Brand
      NEXT_PUBLIC_WHATSAPP_NUMBER: "966500000000"
      NEXT_PUBLIC_DEFAULT_LOCALE: ar
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache MongoDB binary for tests
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Types, lint, format, unit + integration + contract tests
        run: npm run check
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build and run E2E journeys
        run: npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
